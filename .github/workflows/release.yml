name: Build and Release DevPulse CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_name: devpulse-linux-amd64
          - os: macos-latest
            target_name: devpulse-macos-amd64
          - os: windows-latest
            target_name: devpulse-windows-amd64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --console --name devpulse devpulse.py
        shell: bash

      - name: Archive Binary (Linux/macOS)
        run: |
          cd dist/devpulse
          tar -czf ../../${{ matrix.target_name }}.tar.gz *
        shell: bash
        if: runner.os != 'Windows'

      - name: Archive Binary (Windows)
        run: |
          cd dist/devpulse
          Compress-Archive -Path * -DestinationPath ../../${{ matrix.target_name }}
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

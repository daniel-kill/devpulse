name: Build and Release DevPulse CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: devpulse-linux-amd64
            binary_src: dist/devpulse
            archive_name: devpulse-linux-amd64.tar.gz
          - os: macos-latest
            artifact_name: devpulse-macos-amd64
            binary_src: dist/devpulse
            archive_name: devpulse-macos-amd64.tar.gz
          - os: windows-latest
            artifact_name: devpulse-windows-amd64.exe
            binary_src: dist/devpulse.exe
            archive_name: devpulse-windows-amd64.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller .

      - name: Build Binary with PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console --name devpulse --paths src src/devpulse/__main__.py

      - name: Build Binary with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console --name devpulse --paths src src/devpulse/__main__.py
        shell: pwsh

      - name: Archive Binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive_name }} -C dist devpulse

      - name: Archive Binary (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist/devpulse.exe -DestinationPath ${{ matrix.archive_name }}
        shell: pwsh

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

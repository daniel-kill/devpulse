[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpulse"
version = "0.2.0"
description = "High-performance CLI utility for workspace health audits and system monitoring."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "daniel"}
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "GitPython>=3.1.0",
    "psutil>=5.9.0",
]

[project.scripts]
devpulse = "devpulse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
